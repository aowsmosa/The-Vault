# -- Default values for the backend chart --

replicaCount: 2

image:
  repository: myorg/backend
  tag: "1.0.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

containerPort: 3000

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    external-dns.alpha.kubernetes.io/hostname: api.example.com
  host: api.example.com
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 150m
    memory: 192Mi
  limits:
    cpu: 400m
    memory: 384Mi

nodeAffinity:
  enabled: true
  key: role
  operator: In
  values:
    - app

database:
  host: database.default.svc.cluster.local
  port: "5432"
  name: appdb

databaseSecret:
  name: backend-db-credentials
  userKey: username
  passwordKey: password

probes:
  readiness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    path: /healthz
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics
  labels:
    release: kube-prometheus-stack

podAnnotations: {}
podLabels: {}

serviceAccount:
  create: false
  name: ""
