recommender:
  enabled: true
  tolerations:
    - key: workload
      operator: Equal
      value: database
      effect: NoSchedule
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

updater:
  enabled: true
  tolerations:
    - key: workload
      operator: Equal
      value: database
      effect: NoSchedule
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

admissionController:
  enabled: true
  tolerations:
    - key: workload
      operator: Equal
      value: database
      effect: NoSchedule
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
