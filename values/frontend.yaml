image:
  repository: aowsmosa/frontend
  tag: "1.0.0"

serviceMonitor:
  enabled: false  # nginx doesn't expose /metrics; re-enable once we add an exporter

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      podsPerMinute: 2
    scaleDown:
      stabilizationWindowSeconds: 300
